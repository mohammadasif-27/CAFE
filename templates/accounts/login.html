{% extends 'base.html' %}
{% block title %}Login — CafeHub{% endblock %}

{% block content %}
<section class="section" style="padding:6rem 2rem;">
  <div style="max-width:540px;margin:0 auto;">
    <div class="auth-card">
      <h2>Sign in to your account</h2>
      <form method="post" novalidate>
        {% csrf_token %}
        {{ form.non_field_errors }}
        <div class="form-group">
          <label for="id_login">Username or Email</label>
          <input type="text" name="login" id="id_login" required placeholder="Username or email" value="{{ request.POST.login }}">
        </div>
        <div class="form-group">
          <label for="id_password">Password</label>
          <div style="position:relative;">
            <input type="password" name="password" id="id_password" required placeholder="Your password">
            <button type="button" class="password-toggle" aria-label="Toggle password visibility">Show</button>
          </div>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <div style="display:flex;gap:1rem;align-items:center;margin-top:1rem;">
          <button class="btn btn-primary" type="submit">Sign In</button>
          <a href="{% url 'accounts:register' %}" class="btn btn-secondary">Create account</a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
